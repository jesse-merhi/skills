interface:
  display_name: "PR Proof Pack"
  short_description: "Prove PR behavior with the right real evidence"
  default_prompt: "Use $pr-proof-pack to explain what broke and how it is fixed, prove textual behavior with copyable text, prove static UI with actual screenshots matched to meaningful reproducible baselines, prove motion or manual interaction with recordings, keep technical diagrams separate as system explanations, publish through the repository command on GitHub or TWG on Bitbucket Cloud, and verify the rendered proof."
