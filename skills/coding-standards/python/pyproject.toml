[project]
name = "standards-checks"
version = "0.1.0"
description = "Custom coding-standards checks for the Python ecosystem preset"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff==0.16.5",
    "pytest==9.1.1",
    "mypy==2.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
