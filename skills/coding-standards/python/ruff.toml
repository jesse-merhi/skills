# Ruff half of the Python coding-standards preset.
# `lint.extend-select` is exactly the union of every `kind: "ruff"` select in
# the python column of catalog.json; tests/test_catalog.py fails if the two
# drift. It is `extend-select` rather than `select` so a target that extends
# this file keeps ruff's defaults and its own additions. A target whose own
# config sets `select` cannot use `extend`, since ruff resets the enabled set
# at that `select`; it copies this list into its own `extend-select` instead.


[lint]
extend-select = [
  "ANN401",
  "ASYNC",
  "B",
  "F401",
  "F811",
  "I",
  "PGH003",
  "PGH004",
  "PLW0120",
  "PLW0406",
  "PT",
  "RET",
  "RUF006",
  "S110",
  "S608",
  "SIM103",
]
