rules:
  - id: no-raw-sql-orm-escape
    languages:
      - python
    severity: ERROR
    message: >-
      SQL built by string formatting is handed to a raw-query escape hatch.
      Ruff's S608 does not see through `.raw(...)`, `text(...)` and
      `cursor.execute(...)`, and neither does the ORM: the interpolated value
      reaches the database as SQL. Pass the value as a query parameter instead.
    metadata:
      standard: no-raw-sql
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: $QUERY.raw($SQL, ...)
          - pattern: $QUERY.execute($SQL, ...)
          - pattern: $QUERY.executemany($SQL, ...)
          - pattern: $QUERY.execute(text($SQL), ...)
      - metavariable-pattern:
          metavariable: $SQL
          pattern-either:
            - pattern: f"..."
            - pattern: '"..." % $VALUES'
            - pattern: '"...".format(...)'
            - pattern: '"..." + $VALUE'
            - pattern: $VALUE + "..."
