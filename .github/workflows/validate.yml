name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  skills:
    name: Skills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Rust
        run: rustup default stable

      - name: Validate skill metadata and helper behavior
        run: |
          ./tests/skills-test
          ./tests/review-findings-test
          python3 -m unittest discover -s skills/wait-efficiently/scripts -p 'test_*.py'

      - name: Check shell, Python, and JavaScript syntax
        run: |
          bash -n \
            tests/skills-test \
            tests/review-findings-test \
            skills/handoff/scripts/codex-handoff-tmux \
            skills/openclaw/openclaw-local-test/scripts/openclaw-local-test \
            skills/openclaw/openclaw-local-test/scripts/openclaw-dia-test \
            skills/code-review/scripts/review-findings \
            skills/code-review/scripts/install-review-findings \
            skills/code-review/scripts/check-review-models \
            skills/code-review/scripts/calibrate-structured-review \
            skills/code-review/scripts/test-codex-review-helper
          python3 -m py_compile skills/code-review/scripts/*.py skills/pr-proof-pack/scripts/*.py skills/wait-efficiently/scripts/*.py
          node --check skills/frontend-ui-validation/scripts/audit-layout.mjs

      - name: Check review-findings Rust helper
        run: |
          cargo fmt --check --manifest-path skills/code-review/scripts/review-findings-rs/Cargo.toml
          cargo check --locked --manifest-path skills/code-review/scripts/review-findings-rs/Cargo.toml
          cargo test --locked --manifest-path skills/code-review/scripts/review-findings-rs/Cargo.toml
