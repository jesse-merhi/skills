name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  skills:
    name: Skills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate skill metadata and helper behavior
        run: |
          ./tests/skills-test
          ./tests/review-findings-test
          python3 -m unittest discover -s skills/openclaw/openclaw-stg-test/scripts -p 'test_*.py'
          pnpm validate:effect

      - name: Check remaining shell and JavaScript syntax
        run: |
          bash -n \
            tests/skills-test \
            tests/review-findings-test
          python3 -m py_compile \
            skills/openclaw/openclaw-stg-test/scripts/openclaw-stg-test \
            skills/openclaw/openclaw-stg-test/scripts/test_openclaw_stg_test.py
          node --check skills/frontend-ui-validation/scripts/audit-layout.mjs
