name: Validate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  skills:
    name: Skills
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Node dependencies
        run: bun ci

      - name: Validate executable helpers and repository
        run: |
          ./tests/skills-test
          bun run validate:effect

      - name: Check remaining shell and JavaScript syntax
        run: |
          bash -n \
            tests/skills-test
          node --check skills/frontend-ui-validation/scripts/audit-layout.mjs
