model = "gpt-6-astra"
model_reasoning_effort = "medium"

[agents]
enabled = true
max_concurrent_threads_per_session = 4
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "high"

[agents.implementer]
description = "Implement a bounded change and its tests with Sol."
config_file = "orchestration/implementer.toml"

[agents.investigator]
description = "Investigate a bounded code or documentation question with Luna; return evidence without edits."
config_file = "orchestration/investigator.toml"

[agents.findings_reviewer]
description = "Independent findings-only Astra reviewer. Not a coordinator or an until-clean workflow."
config_file = "findings-reviewer.config.toml"
