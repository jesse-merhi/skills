model = "gpt-6.1-sol"
model_reasoning_effort = "high"

[agents]
enabled = true
max_concurrent_threads_per_session = 4
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "high"

[agents.implementer]
description = "Implement a bounded change and its tests with Sol."
config_file = "orchestration/implementer.toml"

[agents.test_executor]
description = "Run an established validation batch with Luna; retain evidence and stop on failure."
config_file = "orchestration/test-executor.toml"

[agents.investigator]
description = "Investigate a bounded code or documentation question with Luna; return evidence without edits."
config_file = "orchestration/investigator.toml"

[agents.findings_reviewer]
description = "Independent findings-only Sol reviewer. Not a coordinator or an until-clean workflow."
config_file = "orchestration/findings-reviewer.toml"

[agents.oracle]
description = "Optional read-only Astra consultation on a bounded unresolved decision; return evidence and advice to the coordinator."
config_file = "orchestration/oracle.toml"
